name: Resolve the private Go SDK
description: >-
  Lets `go` fetch github.com/monte-carlo-data/mc-sdk-go while that repository is private.
  Delete this action, and every step that uses it, once the SDK is public.

inputs:
  app-id:
    description: ID of the GitHub App the read token is minted from.
    required: true
  private-key:
    description: Private key of that GitHub App.
    required: true

runs:
  using: composite
  steps:
    # Minted from the org-wide CI App rather than a credential of our own, scoped to the one
    # repository and to `contents: read`, and expiring within the hour.
    - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      id: sdk-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: monte-carlo-data
        repositories: mc-sdk-go
        permission-contents: read

    # GOPRIVATE keeps the module off the public proxy and checksum database, neither of which can
    # serve a private repository; go.sum still verifies the hash locally. The credential goes in
    # an http header rather than the remote URL, so it stays out of .git/config.
    - name: Let the build resolve the private SDK module
      shell: bash
      env:
        TOKEN: ${{ steps.sdk-token.outputs.token }}
      run: |
        go env -w GOPRIVATE='github.com/monte-carlo-data/*'
        header="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        git config --global http.https://github.com/.extraheader "Authorization: Basic $header"
