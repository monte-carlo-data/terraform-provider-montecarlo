name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the tree. Nothing here publishes, comments or writes.
permissions:
  contents: read

jobs:
  build:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The Go version comes from go.mod's `go` directive, so it cannot drift from the module.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/private-sdk
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

  release-snapshot:
    name: The release builds for every platform
    # Tags are immutable, so a release that fails after tagging burns that version. A change that
    # breaks cross-compiling or packaging has to fail here, before the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/private-sdk
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}

      # A throwaway key, so the snapshot exercises the signing config the release uses.
      - name: Throwaway signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key ci-snapshot@example.invalid default default never
          echo "GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      # Everything a release does except publishing.
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean

  bot-dependency-diff:
    name: The bot's dependency change stays narrow
    # go.mod and go.sum carry no code owner, so that a generated pull request requests no review.
    # That is only safe while the bot's dependency change is the SDK pin and nothing else, which
    # is what this asserts. Only the generated branch is unowned, so only it is checked.
    if: github.head_ref == 'api-codegen/spec-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Only the mc-sdk-go lines may change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          changed=$(git diff "origin/$BASE_REF...HEAD" -- go.mod go.sum | grep -E '^[+-][^+-]' || true)
          stray=$(printf '%s\n' "$changed" | grep -v 'monte-carlo-data/mc-sdk-go' | grep -v '^$' || true)
          if [ -n "$stray" ]; then
            echo "This pull request changes dependencies beyond the SDK pin:"
            printf '%s\n' "$stray"
            echo
            echo "These files carry no code owner, so nobody is asked to review them."
            echo "A change beyond the mc-sdk-go lines needs a person to look at it."
            exit 1
          fi
          echo "Only the mc-sdk-go lines changed."
