name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the tree. Nothing here publishes, comments or writes.
permissions:
  contents: read

jobs:
  build:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Go version comes from go.mod's `go` directive, so it cannot drift from the module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...
