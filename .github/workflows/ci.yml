name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the tree. The tag job writes through a single-repository App token, and the
# release job is granted contents: write for the GitHub release.
permissions:
  contents: read

jobs:
  build:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The Go version comes from go.mod's `go` directive, so it cannot drift from the module.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: The release tag is worked out correctly
        run: |
          .github/scripts/next-tag.sh > /dev/null
          .github/scripts/next-tag_test.sh
          .github/scripts/release-tag_test.sh

      # The registry renders docs/ as committed, so it has to match the schemas and examples.
      - name: Check the registry docs and third-party notices are current
        run: |
          go generate ./...
          stale="$(git status --porcelain -- docs THIRD_PARTY_NOTICES)"
          if [ -n "$stale" ]; then
            echo "Generated files are out of date. Run go generate ./... and commit the result:"
            echo "$stale"
            exit 1
          fi

  examples:
    name: Every example validates against this build
    # The docs embed the examples unparsed, so a schema change that breaks one would otherwise ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate the examples
        run: .github/scripts/validate-examples.sh

  release-snapshot:
    name: The release builds for every platform
    # Tags are immutable, so a release that fails after tagging burns that version. A change that
    # breaks cross-compiling or packaging has to fail here, before the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-go's cache key is shared with the build job, whose cache holds only linux/amd64
      # objects, so this job keeps its cross-compiled ones under a key of its own.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-snapshot-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: release-snapshot-${{ runner.os }}-

      # A throwaway key, so the snapshot exercises the signing config the release uses.
      - name: Throwaway signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key ci-snapshot@example.invalid default default never
          echo "GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      # Everything a release does except publishing.
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean

  bot-dependency-diff:
    name: The bot's dependency change stays narrow
    # go.mod and go.sum carry no code owner, so that a generated pull request requests no review.
    # That is only safe while the bot's dependency change is the SDK pin and nothing else, which
    # is what this asserts. The bot is identified by author and by a branch in this repository,
    # not by branch name, which a fork can choose.
    if: >-
      github.event.pull_request.user.login == 'mc-ci-cd-app[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only the mc-sdk-go lines may change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff "origin/$BASE_REF...HEAD" -- go.mod go.sum | grep -E '^[+-][^+-]' || true)
          stray=$(printf '%s\n' "$changed" | grep -v 'monte-carlo-data/mc-sdk-go' | grep -v '^$' || true)
          if [ -n "$stray" ]; then
            echo "This pull request changes dependencies beyond the SDK pin:"
            printf '%s\n' "$stray"
            echo
            echo "These files carry no code owner, so nobody is asked to review them."
            echo "A change beyond the mc-sdk-go lines needs a person to look at it."
            exit 1
          fi
          echo "Only the mc-sdk-go lines changed."

  tag:
    name: Tag the release
    needs: [build, release-snapshot, examples]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One run at a time, so two quick merges cannot pick the same tag. A run still waiting here is
    # replaced by a newer one, whose release then covers both merges.
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the tag
        id: next
        run: |
          tag=$(.github/scripts/next-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Tag creation is restricted to the org App and the `apollo` team by a ruleset, and tags are
      # immutable.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: token
        if: steps.next.outputs.tag != ''
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: terraform-provider-montecarlo
          permission-contents: write

      - name: Tag ${{ steps.next.outputs.tag }}
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG."

  # Reads the tag from the commit, so a rerun that finds the commit already tagged still releases
  # it. Kept out of the release job so an untagged commit never enters the release environment.
  release-tag:
    name: Find the commit's release tag
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the tag
        id: find
        run: |
          tag=$(.github/scripts/release-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The signing key is released only to this job, which runs from main's own workflow file; the
  # `release` environment accepts only `main`.
  release:
    name: Build, sign and publish the release
    needs: release-tag
    if: needs.release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    # GoReleaser creates the GitHub release with GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # No build cache: a release is built from a clean module download, never from a cache that
      # another workflow could have written.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: ./.github/actions/goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
