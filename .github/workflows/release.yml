name: Release

on:
  push:
    tags: ["v*"]

# Creating the GitHub release and uploading its assets needs write access to contents.
permissions:
  contents: write

jobs:
  goreleaser:
    name: Build, sign and publish the release
    runs-on: ubuntu-latest
    # The signing key lives in this environment, which only `v*` tags can deploy to.
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on a commit that never reached main would skip its review, so refuse to release it.
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # No build cache: a release is built from a clean module download, never from a cache that
      # another workflow could have written.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: ./.github/actions/goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
