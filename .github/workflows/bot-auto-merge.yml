name: Auto-merge regenerations

# Approves and queues for merge a pull request from the regeneration bot that touches only
# generated paths. The merge itself still waits for the required checks.
#
# pull_request_target runs this file as it is on main, so a pull request cannot edit its own
# approval rules. Nothing here checks out or runs the pull request's code: it reads metadata
# through the API, which is what makes the trigger safe.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] metadata only, no checkout
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  approve:
    name: Approve a generated-only pull request
    # Off until the repository variable BOT_AUTO_MERGE is set to "true". The author and a branch
    # in this repository identify the bot; a fork can match neither.
    if: >-
      vars.BOT_AUTO_MERGE == 'true' &&
      github.event.pull_request.user.login == 'mc-ci-cd-app[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'api-codegen/spec-update'
    runs-on: ubuntu-latest
    steps:
      - name: Every changed file is generated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The paths CODEOWNERS leaves unowned. Keep the two lists in step.
          generated='^(internal/schema_gen/|internal/provider/[^/]+_(resource|data_source)\.go$|internal/provider/provider\.go$|go\.(mod|sum)$|\.api-codegen-source\.json$|docs/)'

          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          other="$(printf '%s\n' "$files" | grep -Ev "$generated" || true)"
          if [ -n "$other" ]; then
            echo "Not approving: these files are not generated, so a person has to review them."
            printf '%s\n' "$other"
            exit 1
          fi

          # The list describes HEAD_SHA only if nothing was pushed while it was read.
          current="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The branch moved to $current while it was checked; the run for that push decides."
            exit 1
          fi

      # Both are pinned to the commit that was checked, so a later push needs its own run.
      - name: Approve and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA" \
            -f body="Generated paths only. Merges once the required checks pass."
          gh pr merge "$PR" --repo "$REPO" --auto --merge --match-head-commit "$HEAD_SHA"
